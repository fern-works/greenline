name: release
# On a version tag, which only the export makes: the prepared package is
# built, proven and published under npm's trusted publishing with
# provenance. No token is stored anywhere; npm mints one for this run
# through the trusted publisher configured on the package (this
# repository, this workflow file, the environment below).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      # An exact pin (the pin law): the version reviewed at the composition plan's stage C.
      - run: npm install -g npm@11.19.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - name: tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi
      # The public row set builds the package (its tsdown-build row) and audits it (consumer-package); nothing rebuilds after.
      - run: node scripts/check.mjs --public
      - name: audit the tarball
        run: |
          npm pack --dry-run --json ./dist/package > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map(f => f.path);
            const leaks = files.filter(p =>
              !/^(dist\/(bin|corpus)\/|provenance\/|README\.md$|LICENSE$|THIRD_PARTY_NOTICES\.md$|package\.json$)/.test(p));
            if (leaks.length) { console.error("unexpected files in the tarball:", leaks); process.exit(1); }
            console.log(files.length, "files, all of the package");'
      - run: npm publish ./dist/package --access public
