interface:
  display_name: "Diagram Design"
  short_description: "Create branded, durable diagrams as standalone HTML/SVG/PNG for a change, a plan or a decision, saved under the change in the workspace's visual home with a manifest and linked from the record or the document they illustrate. Covers architecture, flowchart, sequence, state machine, ER, timeline, waterfall, and dozens more forms; redraws .drawio, Mermaid and Excalidraw sources at a chosen size and detail. Use when the owner asks for a diagram to keep, a flowchart, a sequence or state chart, or a .drawio or Excalidraw source redrawn."
