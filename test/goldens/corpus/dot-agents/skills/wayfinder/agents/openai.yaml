interface:
  display_name: "Wayfinder"
  short_description: "Plan a huge chunk of work (more than one agent session can hold) as a shared map of decision tickets in a plan directory's map.md, and resolve them one at a time until the way to the destination is clear. Use when the owner asks for the work planned in tickets, or for a huge chunk of work spanning several sessions."
policy:
  allow_implicit_invocation: false
