interface:
  display_name: "Show Me"
  short_description: "Explain the current topic visually in the reply: pseudocode, call trees, component trees, shallow file trees, shape diffs and box drawings in text, a mermaid block only where the surface renders one, and a lasting picture made only on the owner's ask. Use whenever a reply would walk through a flow, a hierarchy, a state machine, a comparison, or a change to an existing shape, and whenever the owner asks to be shown, a diagram or a sketch."
