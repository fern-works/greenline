interface:
  display_name: "Progress Check"
  short_description: "Give sparse, evidence-based progress updates during long work with no change open: observable milestones weighted by work and risk, an update only when something material changed, one rounded-down bar. Use while a survey, a long diagnosis or other long work with several milestones runs outside a change's steps, never for a short answer, for work with no intermediate state or inside a change, whose progress line the block's reply section owns; and the moment the owner asks to change how or how often you report progress (\"keep me posted\"), whether more updates, total silence or an estimated clock, BEFORE any such preference is saved anywhere."
