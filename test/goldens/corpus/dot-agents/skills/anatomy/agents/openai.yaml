interface:
  display_name: "Anatomy"
  short_description: "Build an interactive figure that explains a concept as a real physical object whose working is the idea (a test rig, a dial gauge, a cabinet of drawers, a lock): sized and timed first, every number driven by one truth model, many small precise solid parts with four-tone shading in a measured painter's order, framed in a card with a live readout and calm motion, and verified at 4x in both themes; WebGL light, a 3D mode and printable A4 sheets where they earn their place. Use when the owner asks for an explanatory or interactive figure of a mechanism, something to click through, for the code or for the project's docs or site, or says yes to one offered."
